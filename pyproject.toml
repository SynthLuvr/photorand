[project]
name = "photorand"
version = "1.3.0"
description = "A True Random Number Generator using raw camera sensor data."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Daniel Illescas Romero", email = "dev@daniel-ir.eu" }]
dependencies = [
    "rawpy>=0.26.1",
    "numpy>=2.0.0",
    "cryptography>=46.0.0",
    "opencv-python-headless>=5.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/illescasDaniel/photorand"

[project.scripts]
photorand = "src.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]
build = ["build", "twine"]
examples = ["imageio", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["src/tests/data"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
