[project]
name = "photorand"
version = "1.3.0"
description = "A True Random Number Generator using raw camera sensor data."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Daniel Illescas Romero", email = "dev@daniel-ir.eu" }]
dependencies = [
    "rawpy>=0.26.1",
    "numpy>=2.0.0",
    "cryptography>=46.0.0",
    "opencv-python-headless>=5.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/illescasDaniel/photorand"

[project.scripts]
photorand = "src.cli.main:main"

[project.optional-dependencies]
# The lint/format/test toolchain comes from canonist — one dev dependency
# that bundles ruff, pyright, pytest (+coverage), pip-audit, the
# duplication gate, and the canonical tool presets. Poe stays consumer-side.
dev = ["canonist>=0.2.1", "poethepoet>=0.48.0"]
build = ["build", "twine"]
examples = ["imageio", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
exclude = ["src/tests/data"]

# Poe auto-detects the uv virtualenv, so task commands run tools directly
# without an `uv run` prefix. Every task goes through `python -m <module>`
# rather than a console script, so nothing depends on generated
# entry-point launchers.
[tool.poe.tasks.lint]
help = "Full static pipeline via canonist (format check, lint, typecheck, lock, audit, dupes)"
cmd = "python -m canonist lint"

[tool.poe.tasks.format]
help = "Auto-format and auto-fix lint issues (writes changes)"
cmd = "python -m canonist format"

[tool.poe.tasks.test]
help = "Run the test suite with the 80% coverage gate"
cmd = "python -m canonist test"

[tool.poe.tasks.doctor]
help = "Diagnose the environment, bundled tools, and generated configs"
cmd = "python -m canonist doctor"

[tool.poe.tasks.check]
help = "Everything: the full lint pipeline plus the test suite"
sequence = ["lint", "test"]

# Local deltas over canonist's bundled presets (deep-merged at invocation
# time: later keys win, lists replace, tables merge recursively). Keep only
# true local deltas here — rule and preset changes belong in canonist; bump
# its version to pick them up.
[tool.canonist.ruff.lint.per-file-ignores]
# Lists replace (not merge), so keep the preset's S101 alongside: tests use
# `random.Random` to synthesize fixture data (never for crypto purposes).
"src/tests/*" = ["S101", "S311"]
